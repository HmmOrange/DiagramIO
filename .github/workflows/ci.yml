name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Push mới lên cùng nhánh/PR thì hủy lần chạy cũ đang dở
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Chạy toàn bộ test, gồm ArchitectureTest và test Testcontainers PostgreSQL
      # (runner ubuntu-latest có sẵn Docker)
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
